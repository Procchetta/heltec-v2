name: Build Meshtastic Heltec V2 / V2.1

on:
  schedule:
    # Ejecución programada semanal todos los domingos a las 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      meshtastic_tag:
        description: 'Tag de Meshtastic a compilar (ej: v2.7.26.54e0d8d o "latest")'
        required: false
        default: 'latest'
      force_build:
        description: 'Forzar compilación aunque el release ya exista'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'variants/**'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  check-version:
    name: Check Latest Meshtastic Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-version.outputs.tag }}
      should_build: ${{ steps.check-existing.outputs.should_build }}
      release_name: ${{ steps.get-version.outputs.release_name }}
    steps:
      - name: Resolve Meshtastic Tag
        id: get-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.meshtastic_tag }}
        run: |
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "latest" ]; then
            TAG="$INPUT_TAG"
          else
            echo "Fetching latest release tag from meshtastic/firmware..."
            TAG=$(curl -s -H "Accept: application/vnd.github+json" https://api.github.com/repos/meshtastic/firmware/releases/latest | jq -r .tag_name)
          fi
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: No se pudo determinar el tag de Meshtastic."
            exit 1
          fi

          echo "Target Meshtastic Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=Meshtastic $TAG (Heltec V2 & V2.1)" >> $GITHUB_OUTPUT

      - name: Check if Release already exists in our repo
        id: check-existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get-version.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forcing build as requested."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          EXISTING=$(gh release view "$TAG" --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
          if [ "$EXISTING" = "$TAG" ]; then
            echo "Release $TAG already exists in ${{ github.repository }}. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist yet. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Firmware for Heltec V2.0 and V2.1
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clone Meshtastic Firmware Source (${{ needs.check-version.outputs.tag }})
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          echo "Cloning meshtastic/firmware tag $TAG..."
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules https://github.com/meshtastic/firmware.git firmware_src

      - name: Sync Heltec V2 & V2.1 Variants
        run: |
          echo "Ensuring variants are present in firmware_src..."
          mkdir -p firmware_src/variants/esp32/heltec_v2
          mkdir -p firmware_src/variants/esp32/heltec_v2.1
          cp -rf variants/esp32/heltec_v2/* firmware_src/variants/esp32/heltec_v2/
          cp -rf variants/esp32/heltec_v2.1/* firmware_src/variants/esp32/heltec_v2.1/

      - name: Build Heltec V2.0 Firmware
        working-directory: firmware_src
        run: |
          echo "================ Compiling heltec-v2_0 ================"
          pio run -e heltec-v2_0

      - name: Build Heltec V2.1 Firmware
        working-directory: firmware_src
        run: |
          echo "================ Compiling heltec-v2_1 ================"
          pio run -e heltec-v2_1

      - name: Organize & Package Release Assets
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          mkdir -p release_assets

          echo "Collecting binaries for heltec-v2_0..."
          if [ -f firmware_src/.pio/build/heltec-v2_0/firmware.factory.bin ]; then
            cp firmware_src/.pio/build/heltec-v2_0/firmware.factory.bin "release_assets/firmware-heltec-v2_0-${TAG}-factory.bin"
          fi
          if [ -f firmware_src/.pio/build/heltec-v2_0/firmware.bin ]; then
            cp firmware_src/.pio/build/heltec-v2_0/firmware.bin "release_assets/firmware-heltec-v2_0-${TAG}.bin"
          fi
          find firmware_src/.pio/build/heltec-v2_0/ -maxdepth 1 -name "firmware-heltec-v2_0-*.bin" -exec cp {} release_assets/ \; || true

          echo "Collecting binaries for heltec-v2_1..."
          if [ -f firmware_src/.pio/build/heltec-v2_1/firmware.factory.bin ]; then
            cp firmware_src/.pio/build/heltec-v2_1/firmware.factory.bin "release_assets/firmware-heltec-v2_1-${TAG}-factory.bin"
          fi
          if [ -f firmware_src/.pio/build/heltec-v2_1/firmware.bin ]; then
            cp firmware_src/.pio/build/heltec-v2_1/firmware.bin "release_assets/firmware-heltec-v2_1-${TAG}.bin"
          fi
          find firmware_src/.pio/build/heltec-v2_1/ -maxdepth 1 -name "firmware-heltec-v2_1-*.bin" -exec cp {} release_assets/ \; || true

          # Copiar bootloader y particiones si existen
          cp firmware_src/.pio/build/heltec-v2_0/bootloader.bin release_assets/bootloader.bin 2>/dev/null || true
          cp firmware_src/.pio/build/heltec-v2_0/partitions.bin release_assets/partitions.bin 2>/dev/null || true

          # Crear archivo ZIP con todo el contenido
          cd release_assets
          zip -r "../meshtastic-heltec-v2-bundle-${TAG}.zip" ./*
          cd ..
          mv "meshtastic-heltec-v2-bundle-${TAG}.zip" release_assets/

          # Generar sumas de verificación SHA256 únicamente sobre archivos
          cd release_assets
          sha256sum *.bin *.zip > SHA256SUMS.txt
          cd ..

          echo "Contenido final de release_assets:"
          ls -la release_assets

      - name: Generate Release Notes
        id: release-notes
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          cat << 'EOF' > release_notes.md
          ## Meshtastic Firmware para Heltec V2.0 y V2.1 📡

          Compilación automatizada de la versión oficial de **Meshtastic [TAG_PLACEHOLDER](https://github.com/meshtastic/firmware/releases/tag/TAG_PLACEHOLDER)**.

          ### 📦 Archivos disponibles para descarga:

          #### 🔹 Heltec V2.0 (`heltec-v2_0`):
          - **`firmware-heltec-v2_0-TAG_PLACEHOLDER-factory.bin`**: Imagen completa (flasheo limpio desde dirección `0x00`).
          - **`firmware-heltec-v2_0-TAG_PLACEHOLDER.bin`**: Actualización OTA o flasheo en offset de app (`0x10000`).

          #### 🔹 Heltec V2.1 (`heltec-v2_1`):
          - **`firmware-heltec-v2_1-TAG_PLACEHOLDER-factory.bin`**: Imagen completa (flasheo limpio desde dirección `0x00`).
          - **`firmware-heltec-v2_1-TAG_PLACEHOLDER.bin`**: Actualización OTA o flasheo en offset de app (`0x10000`).

          #### 📦 Paquete completo:
          - **`meshtastic-heltec-v2-bundle-TAG_PLACEHOLDER.zip`**: Todos los binarios, particiones y bootloader.
          - **`SHA256SUMS.txt`**: Verificación de integridad.

          ---

          ### ⚡ Instrucciones de Flasheo:

          #### Opción A: Web Flasher (Recomendado)
          1. Conecta tu placa Heltec por USB usando Google Chrome o MS Edge.
          2. Ingresa a [ESP Web Flasher (esp.huhn.me)](https://esp.huhn.me/) o [Web Meshtastic Flasher](https://flasher.meshtastic.org/).
          3. Carga el archivo **`*-factory.bin`** en la dirección `0x00` y haz clic en **Program**.

          #### Opción B: Flasheo con `esptool.py`
          ```bash
          # Para instalación limpia (reemplaza COM_PORT o /dev/ttyUSB0):
          esptool.py --chip esp32 --port /dev/ttyUSB0 erase_flash
          esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 921600 write_flash 0x00 firmware-heltec-v2_0-TAG_PLACEHOLDER-factory.bin
          ```
          EOF
          sed -i "s/TAG_PLACEHOLDER/$TAG/g" release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.release_name }}
          body_path: release_notes.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
